control_node:
  ros__parameters:
    target_error_topic: /planning/target_error
    target_speed_topic: /planning/target_speed
    local_path_topic: /planning/local_path
    localization_topic: /localization/odometry
    ego_status_topic: /ego_vehicle_status
    ctrl_cmd_topic: /ctrl_cmd

    control_rate_hz: 30.0
    command_timeout_sec: 0.6
    status_timeout_sec: 0.6
    local_path_timeout_sec: 0.6
    localization_timeout_sec: 0.6

    # 2020 Hyundai Sonata geometry; maximum wheel angle is approximately 35 deg.
    wheelbase_m: 2.84
    max_wheel_angle_rad: 0.610865

    # Measured EgoVehicleStatus speed: clamp((km/h / 3.6) * preview, min, max).
    # Repeated K-City 334m tests: advance low-speed tracking slightly.
    # Preview is unchanged above 24km/h (50km/h still uses 6.25m).
    lookahead_min_m: 3.0
    lookahead_max_m: 10.0
    lookahead_preview_time_sec: 0.45
    # Legacy lookahead_distance_m supplies min only when lookahead_min_m is
    # omitted at startup. An explicit lookahead_min_m takes precedence.

    # Pure Pursuit is LEFT-positive; MORAI commands are RIGHT-positive.
    steering_sign: -1.0
    # The 5.04m K-City bend exceeds the measured ~6.58m radius at 0.70.
    # 0.85 was validated with the lateral/braking envelope enabled.
    max_front_steer_normalized: 0.85
    # Shape the converted command using elapsed time, with no hidden LPF state.
    # Explicit/watchdog stops bypass shaping and clear its history immediately.
    steering_filter_time_constant_sec: 0.08
    steering_max_rate_per_sec: 1.5
    # Optional spatial target smoothing, disabled until the MORAI comparison.
    # Raw projection/path error and published paths are retained.
    target_smoothing_sigma_m: 0.0
    target_smoothing_max_deviation_m: 0.10
    target_smoothing_reversal_hold_m: 6.0

    speed_kp: 0.14
    speed_ki: 0.015
    speed_kd: 0.02
    # Filter D only; the Planning target and emergency braking stay immediate.
    speed_derivative_filter_time_constant_sec: 0.10
    speed_pid_anti_windup_enabled: true
    speed_integral_limit: 12.0

    max_accel_cmd: 0.60
    max_brake_cmd: 0.80

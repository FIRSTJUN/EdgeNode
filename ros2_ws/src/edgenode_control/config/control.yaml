control_node:
  ros__parameters:
    target_error_topic: /planning/target_error
    target_speed_topic: /planning/target_speed
    local_path_topic: /planning/local_path
    localization_topic: /localization/odometry
    ego_status_topic: /ego_vehicle_status
    ctrl_cmd_topic: /ctrl_cmd

    control_rate_hz: 30.0
    command_timeout_sec: 0.6
    status_timeout_sec: 0.6
    local_path_timeout_sec: 0.6
    localization_timeout_sec: 0.6

    # 2020 Hyundai Sonata geometry; maximum wheel angle is approximately 35 deg.
    wheelbase_m: 2.84
    max_wheel_angle_rad: 0.610865

    # Measured EgoVehicleStatus speed: clamp((km/h / 3.6) * preview, min, max).
    lookahead_min_m: 2.5
    lookahead_max_m: 10.0
    lookahead_preview_time_sec: 0.45
    # Legacy lookahead_distance_m supplies min only when lookahead_min_m is
    # omitted at startup. An explicit lookahead_min_m takes precedence.

    # Pure Pursuit is LEFT-positive; MORAI commands are RIGHT-positive.
    steering_sign: -1.0
    max_front_steer_normalized: 0.70

    speed_kp: 0.14
    speed_ki: 0.015
    speed_kd: 0.02
    speed_integral_limit: 12.0

    max_accel_cmd: 0.60
    max_brake_cmd: 0.80

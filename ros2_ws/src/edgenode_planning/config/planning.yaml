planning_node:
  ros__parameters:

    target_error_topic: /planning/target_error
    target_speed_topic: /planning/target_speed
    state_topic: /planning/state
    recommended_speed_topic: /planning/recommended_speed
    speed_mode_topic: /planning/speed_mode
    speed_curvature_topic: /planning/speed_curvature
    # speed_curvature is the smoothed, distance-persistent decision value.
    # speed_max_curvature remains the raw absolute triplet maximum (1/m).
    speed_max_curvature_topic: /planning/speed_max_curvature
    drive_status_topic: /planning/drive_status

    localization_topic: /localization/odometry
    current_link_topic: /planning/current_link
    map_match_status_topic: /planning/map_match_status
    map_match_distance_topic: /planning/map_match_distance
    map_match_heading_diff_topic: /planning/map_match_heading_diff

    global_path_topic: /planning/global_path
    local_path_topic: /planning/local_path
    local_path_length_m: 20.0
    # Maximum output spacing; keep original corners and dense MGeo points.
    # Progress refers to original global segments, never to resampled points.
    local_path_resample_spacing_m: 2.0
    # Inclusive raw-segment window around previous progress. Arc never retreats;
    # unpassed intermediate segments cannot be skipped to a nearby future leg.
    local_path_search_back: 3
    local_path_search_forward: 10
    local_path_index_topic: /planning/local_path_index
    local_path_progress_topic: /planning/local_path_progress_m
    goal_node_id: A119BS010245
    # Empty: use goal_node_id. Nonempty: visit these nodes in order; the last
    # entry is the final goal (goal_node_id is ignored). Set before driving.
    route_node_ids: []
    # Example using the currently verified destination:
    # route_node_ids: [A119BS010245]
    global_path_frame_id: map

    mgeo_dir: /workspace/local_data/kcity_mgeo
    map_match_search_radius_m: 6.0
    map_match_max_distance_m: 4.0
    map_match_max_heading_diff_deg: 80.0
    map_match_heading_weight: 0.025
    map_match_same_link_bonus: 0.4
    map_match_connected_link_bonus: 0.7
    map_match_unrelated_link_penalty: 1.0

    # Driving is opt-in, bounded by an independent speed cap and session lease.
    enable_drive: false
    # Low-speed default, independent of the recommendation profile below.
    # Explicit experiment preparation may select up to 60 while drive is off.
    max_drive_speed_kmh: 20.0
    drive_duration_sec: 60.0
    # Run live_test.py --prepare before enabling drive: the profile alone
    # does not enable the optional global lateral/braking envelope below.
    cruise_speed_kmh: 60.0
    curve_speed_kmh: 30.0
    sharp_curve_speed_kmh: 25.0
    speed_preview_distance_m: 10.0
    curve_curvature_threshold: 0.025
    sharp_curvature_threshold: 0.07
    # Spatial weighted median and contiguous curvature support, in metres.
    speed_curvature_smoothing_window_m: 2.0
    speed_curvature_persistence_m: 2.0
    # Release margin in 1/m; entry thresholds above are unchanged.
    # Default release thresholds: CURVE 0.035, SHARP_CURVE 0.095.
    speed_curvature_hysteresis: 0.005

    # Experimental global-route speed envelope. Disabled pending MORAI review.
    # These are planning assumptions, not measured vehicle guarantees.
    speed_long_preview_enabled: false
    speed_long_preview_distance_m: 80.0
    speed_plan_deceleration_mps2: 1.5
    speed_plan_reaction_time_sec: 0.5
    speed_plan_distance_margin_m: 5.0
    speed_plan_lateral_accel_mps2: 1.5
    speed_plan_speed_timeout_sec: 0.2
    # Limit only upward target changes. Deceleration caps apply immediately.
    speed_plan_acceleration_mps2: 1.0
    # Faster target recovery only after sustained nonbinding Local CRUISE.
    speed_plan_recovery_acceleration_mps2: 2.0
    speed_plan_recovery_clear_sec: 1.0
    ego_status_topic: /ego_vehicle_status
    long_speed_plan_topic: /planning/long_speed_plan

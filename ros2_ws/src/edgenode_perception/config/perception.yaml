perception_node:
  ros__parameters:
    camera_topic: /camera/image/compressed
    lidar_topic: /lidar/points

    lane_error_topic: /perception/lane_error
    lane_confidence_topic: /perception/lane_confidence
    obstacle_topic: /perception/obstacle
    debug_image_topic: /perception/debug/lane_image/compressed
    identity_debug_image_topic: /perception/debug/identity_image/compressed
    shadow_debug_image_topic: /perception/debug/shadow_identity_image/compressed

    # Camera lane detector
    roi_top_y_ratio: 0.55
    roi_bottom_y_ratio: 0.98
    roi_top_left_x_ratio: 0.0
    roi_top_right_x_ratio: 1.0
    roi_bottom_left_x_ratio: 0.0
    roi_bottom_right_x_ratio: 1.0

    sliding_windows: 9
    sliding_margin_px: 55
    sliding_minpix: 30
    min_lane_pixels: 180
    default_lane_width_px_640: 280.0
    lookahead_y_ratio: 0.80
    adaptive_max_lane_width_ratio: 1.55

    # Passive semantic diagnostics only; never consumed by lane selection.
    semantic_diagnostics_enabled: true
    # Component-median HSV classification, selected from Bag B-F distributions.
    diag_neutral_white_max_saturation: 25
    diag_beige_hue_min: 5
    diag_beige_hue_max: 45
    diag_min_component_pixels: 40
    diag_min_component_y_span: 20
    diag_component_close_kernel: 3
    diag_identity_ambiguity_px: 5.0
    # Observation radius only; equal to the existing 55 px sliding margin.
    diag_identity_max_distance_px: 55.0

    # Diagnostic-only shadow selector; no value below feeds production.
    shadow_right_selector_enabled: true
    shadow_debug_image_enabled: false
    shadow_min_common_y_span_px: 8
    shadow_sample_count: 5
    shadow_min_valid_sample_ratio: 0.8
    shadow_neutral_missing_score: 0.4
    shadow_neutral_contradiction_score: -0.5
    shadow_yellow_position_tiebreak_weight: 0.05
    shadow_min_score: 0.55
    shadow_expected_width_tolerance_ratio: 0.75
    shadow_max_temporal_jump_px: 120.0
    shadow_semantic_weight: 0.10
    shadow_yellow_order_weight: 0.25
    shadow_neutral_order_weight: 0.25
    shadow_geometry_weight: 0.15
    shadow_y_span_weight: 0.10
    shadow_bounds_weight: 0.10
    shadow_temporal_weight: 0.05

    # Strict production A/B override. Keep disabled until offline and live review.
    experimental_shadow_right_override_enabled: false
    experimental_shadow_min_score: 0.85
    experimental_shadow_require_neutral_order: true
    experimental_shadow_max_temporal_delta_px: 35.0
    experimental_shadow_min_common_y_span_px: 17
    experimental_shadow_min_lane_width_ratio: 0.90
    experimental_shadow_max_lane_width_ratio: 1.25
    experimental_shadow_confirm_frames: 4
    experimental_shadow_slew_rate_px_per_frame: 10.0

    # LiDAR obstacle detector (assumes conventional x-forward, y-left, z-up frame)
    lidar_x_min_m: 0.5
    lidar_x_max_m: 20.0
    lidar_abs_y_max_m: 4.0
    lidar_z_min_m: -0.35
    lidar_z_max_m: 1.5
    lidar_max_points: 4500

    dbscan_eps_m: 0.65
    dbscan_min_samples: 6
    min_cluster_points: 8

rear_lidar_obstacle_node:
  ros__parameters:
    clipped_footprints: true
    cluster_centers_topic: /perception/rear_lidar_obstacle_centers
    cluster_distance_m: 0.8
    footprint_tile_size_m: 3.0
    gravity_ground_compensation: true
    ground_plane_filter_enabled: true
    ground_plane_max_slope: 0.15
    ground_plane_min_seed_points: 5
    ground_plane_neighbor_m: 1.5
    ground_plane_tolerance_m: 0.04
    ground_z_threshold: -2.09
    lidar_offset_x_m: 0.0
    lidar_offset_y_m: 0.0
    lidar_topic: /lidar_rear/points
    localization_timeout_sec: 0.6
    localization_topic: /localization/odometry
    min_cluster_points: 5
    min_footprint_extent_m: 0.05
    native_geometry: true
    near_origin_radius_m: 0.3
    nearest_distance_topic: /perception/rear_nearest_obstacle_distance
    obstacle_count_topic: /perception/rear_lidar_obstacle_count
    obstacle_height_filter_enabled: true
    obstacle_max_z_m: -0.79
    obstacles_topic: /planning/rear_obstacles
    oriented_footprints: true
    publish_debug_clouds: false
    roi_max_x: -3.0
    roi_max_y: 15.0
    roi_min_x: -60.0
    roi_min_y: -15.0
    self_mask_half_width_y: 0.8
    self_mask_max_x: 2.0
    self_mask_min_x: -2.4
    sensor_future_tolerance_sec: 0.05
    sensor_max_source_age_sec: 0.6
    sensor_status_period_sec: 0.1
    sensor_status_topic: /perception/rear_lidar_status
    sensor_timeout_sec: 0.6
    source_pair_wait_sec: 0.25
    source_pose_max_gap_sec: 0.25
    tiled_minimum_area_bounds: true
    time_aligned_obstacles: true
    use_sim_time: false
